<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>宝宝识字台</title>
<style>
  :root{
    --bg:#FFF7E6;
    --card:#FFFFFF;
    --primary:#FF8C42;
    --primary-d:#E76F24;
    --blue:#4D96FF;
    --green:#6AB04C;
    --pink:#FF5D8F;
    --yellow:#FFD23F;
    --text:#3A3A3A;
    --muted:#9A8C7A;
    --line:#FFE3B3;
    --radius:22px;
    --shadow:0 8px 22px rgba(255,140,66,.20);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#FFEFD6 0%,#FFF7E6 45%,#FFE9D6 100%);
    color:var(--text);
    font-size:18px;
    line-height:1.5;
    min-height:100vh;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  /* ===== Header ===== */
  header{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(120deg,#FF9A4D,#FFB05C 60%,#FFC06B);
    color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-top));
    padding-top:calc(14px + env(safe-area-inset-top));
    box-shadow:0 6px 18px rgba(255,140,66,.32);
  }
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .title{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;letter-spacing:1px;}
  .title svg{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));}
  .backup{display:flex;gap:8px;}
  .bk-btn{
    background:rgba(255,255,255,.22);color:#fff;border:1.5px solid rgba(255,255,255,.5);
    border-radius:14px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:5px;min-height:40px;transition:background .2s,transform .1s;
  }
  .bk-btn svg{width:16px;height:16px;}
  .bk-btn:active{background:rgba(255,255,255,.38);transform:scale(.96);}
  .tabs{display:flex;gap:8px;margin-top:12px;}
  .tab{
    flex:1;text-align:center;padding:11px 0;border-radius:16px;font-weight:800;font-size:17px;
    background:rgba(255,255,255,.25);color:#fff;cursor:pointer;border:2px solid transparent;min-height:48px;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;
  }
  .tab svg{width:20px;height:20px;}
  .tab.active{background:#fff;color:var(--primary-d);border-color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);}
  /* ===== Layout ===== */
  main{max-width:760px;margin:0 auto;padding:16px;}
  .section{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
  .sec-title{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;margin:0 0 14px;color:var(--primary-d);}
  .sec-title svg{width:24px;height:24px;}
  /* ===== 今天要处理 (handler) ===== */
  .handler{background:linear-gradient(120deg,#FFF3D6,#FFE0B8);border:2px dashed var(--primary);position:relative;overflow:hidden;}
  .handler::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(255,210,63,.5),transparent 70%);}
  .handler.overdue{border-color:#FF4D4D;background:linear-gradient(120deg,#FFE3E3,#FFD0D0);}
  .handler-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative;}
  .handler h2{margin:0;font-size:21px;color:var(--primary-d);display:flex;align-items:center;gap:8px;}
  .handler.overdue h2{color:#D12B2B;}
  .progress-pill{background:#fff;border-radius:30px;padding:6px 14px;font-weight:800;color:var(--primary-d);font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .bar{height:14px;background:#FFE3B3;border-radius:10px;margin-top:12px;overflow:hidden;}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9BD66B);border-radius:10px;transition:width .5s cubic-bezier(.16,1,.3,1);}
  /* ===== Buttons ===== */
  .btn{
    border:none;border-radius:18px;padding:14px 18px;font-size:19px;font-weight:800;cursor:pointer;
    min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    color:#fff;background:var(--primary);box-shadow:0 5px 0 var(--primary-d);transition:transform .08s,box-shadow .08s,filter .2s;
    position:relative;user-select:none;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--primary-d);}
  .btn svg{width:22px;height:22px;}
  .btn.blue{background:var(--blue);box-shadow:0 5px 0 #2f6fd6;}
  .btn.green{background:var(--green);box-shadow:0 5px 0 #4e8c39;}
  .btn.pink{background:var(--pink);box-shadow:0 5px 0 #d23e6e;}
  .btn.ghost{background:#fff;color:var(--primary-d);box-shadow:0 5px 0 var(--line);border:2px solid var(--line);}
  .btn.block{width:100%;}
  .btn.sm{min-height:44px;font-size:16px;padding:10px 14px;border-radius:14px;}
  .btn:disabled{filter:grayscale(.6);opacity:.55;box-shadow:none;}
  /* ===== Flip cards ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;}
  .card{perspective:1000px;height:178px;cursor:pointer;transition:transform .25s cubic-bezier(.16,1,.3,1);}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .card.flip .card-inner{transform:rotateY(180deg);}
  .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);overflow:hidden;}
  .card-front{background:linear-gradient(150deg,#FFE9C7,#FFD08A);}
  .card-front .zi{font-size:78px;font-weight:900;color:var(--primary-d);line-height:1;text-shadow:0 3px 0 rgba(255,255,255,.5);}
  .card-front .hint{position:absolute;bottom:10px;font-size:13px;color:var(--muted);font-weight:700;}
  .card-back{background:#fff;transform:rotateY(180deg);padding:10px;justify-content:space-around;}
  .card-back svg{width:62px;height:62px;}
  .card-back .py{font-size:16px;color:var(--blue);font-weight:800;}
  .card-back .mean{font-size:14px;color:var(--text);}
  .card.done .card-front{background:linear-gradient(150deg,#D8F5C8,#A8E08A);}
  .card.done .card-front .zi{color:#3e7d28;}
  .done-badge{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.22);}
  .done-badge svg{width:18px;height:18px;}
  .card-back .mini-btn{margin-top:4px;}
  .speak{
    position:absolute;top:8px;left:8px;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.85);color:var(--primary-d);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .1s;z-index:2;
  }
  .speak svg{width:20px;height:20px;}
  .speak:active{transform:scale(.9);}
  /* ===== Practice ===== */
  .practice-char{text-align:center;margin:6px 0 18px;position:relative;}
  .practice-char .big{font-size:100px;font-weight:900;color:var(--primary-d);line-height:1;text-shadow:0 4px 0 rgba(255,210,63,.4);}
  .practice-char svg{width:90px;height:90px;margin:0 auto;display:block;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .opt{
    background:#FFF3E0;border:3px solid var(--line);border-radius:18px;padding:18px 10px;
    font-size:24px;font-weight:800;color:var(--primary-d);cursor:pointer;min-height:64px;
    display:flex;align-items:center;justify-content:center;transition:transform .1s,background .2s;
  }
  .opt:active{transform:scale(.96);}
  .opt.correct{background:#D8F5C8;border-color:var(--green);color:#3e7d28;animation:pop .4s;}
  .opt.wrong{background:#FFE0E0;border-color:#FF6B6B;color:#c0392b;animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .practice-foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .cards .card{animation:rise .45s both;}
  /* ===== Stars / level ===== */
  .ring-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .ring{position:relative;width:130px;height:130px;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(255,210,63,.4));}
  .ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .ctr b{font-size:34px;color:var(--primary-d);line-height:1;}
  .ring .ctr small{font-size:13px;color:var(--muted);font-weight:700;}
  .level-info{flex:1;min-width:180px;}
  .level-info .lv{font-size:26px;font-weight:900;color:var(--primary-d);}
  .level-info p{margin:6px 0 0;color:var(--muted);font-size:15px;}
  .rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px;}
  .reward{background:#FFF8EE;border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;transition:transform .2s,box-shadow .2s;}
  .reward:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(255,140,66,.18);}
  .reward .ico{width:42px;height:42px;margin:0 auto 6px;}
  .reward .nm{font-weight:800;font-size:16px;}
  .reward .cost{color:var(--pink);font-weight:800;font-size:15px;margin:4px 0 8px;}
  /* ===== Parent gate ===== */
  .gate{max-width:420px;margin:30px auto;text-align:center;}
  .gate .lock{width:80px;height:80px;margin:0 auto 14px;}
  .gate input{
    width:100%;font-size:28px;text-align:center;letter-spacing:14px;border:3px solid var(--line);
    border-radius:16px;padding:14px;margin:14px 0;background:#fff;color:var(--text);min-height:56px;
  }
  .err{color:#D12B2B;font-weight:700;min-height:22px;margin-bottom:8px;}
  /* ===== Lists ===== */
  .item{display:flex;align-items:center;gap:12px;background:#FFF8EE;border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;}
  .item .info{flex:1;}
  .item .info b{font-size:17px;}
  .item .info small{display:block;color:var(--muted);font-size:13px;}
  .item .acts{display:flex;gap:8px;}
  .inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .inline-form input{flex:1;min-width:140px;font-size:16px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;min-height:48px;}
  .inline-form input[type=number]{max-width:120px;}
  .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .row2>*{flex:1;min-width:160px;}
  .tip{background:#FFF3D6;border:2px solid var(--yellow);border-radius:14px;padding:10px 14px;color:var(--primary-d);font-weight:700;font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .tip svg{width:20px;height:20px;flex:0 0 auto;}
  .muted{color:var(--muted);font-size:14px;}
  .center{text-align:center;}
  .mt{margin-top:14px;}
  .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:14px 22px;border-radius:30px;font-weight:800;font-size:16px;opacity:0;pointer-events:none;transition:all .3s;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.3);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* ===== Parent view ===== */
  .psec{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
  .psec h3{margin:0 0 12px;font-size:19px;color:var(--primary-d);display:flex;align-items:center;gap:8px;}
  .psec h3 svg{width:22px;height:22px;}
  /* ===== Library preview ===== */
  .libgroup{margin-bottom:14px;}
  .libgroup h4{margin:0 0 8px;color:var(--primary-d);font-size:15px;}
  .librow{display:flex;flex-wrap:wrap;gap:6px;}
  .libitem{width:58px;display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px;border-radius:12px;transition:background .2s;}
  .libitem:active{background:#FFF3E0;}
  .libitem .lz{font-size:24px;font-weight:900;color:var(--primary-d);line-height:1.1;}
  .libitem svg{width:36px;height:36px;}
  .cat-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);background:#FFF3E0;border-radius:10px;padding:2px 8px;margin-left:6px;}
  /* ===== fx canvas ===== */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:80;display:none;}
  @media(max-width:560px){
    body{font-size:17px;}
    .cards{grid-template-columns:repeat(2,1fr);}
    .opts{grid-template-columns:1fr;}
    .title{font-size:19px;}
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div class="title">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7l3-3h10l3 3v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z" fill="#fff"/><path d="M9 4h6v4H9z" fill="#FFD23F"/><circle cx="12" cy="13" r="2.4" fill="#FF8C42"/></svg>
      宝宝识字台
    </div>
    <div class="backup">
      <button class="bk-btn" onclick="exportJSON()">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v10m0 0l-4-4m4 4l4-4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        导出
      </button>
      <button class="bk-btn" onclick="document.getElementById('imp').click()">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 15V5m0 0l-4 4m4-4l4 4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
        导入
      </button>
      <input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)">
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="tabKid" onclick="switchMode('kid')">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
      孩子模式
    </div>
    <div class="tab" id="tabPar" onclick="switchMode('parent')">
      <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#fff" stroke-width="2.2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="15" r="1.6" fill="#fff"/></svg>
      家长模式
    </div>
  </div>
</header>

<main id="app"></main>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<script>
/* ===================== 数据：象形字库（含分类） ===================== */
const CAT = {nature:'自然', body:'人体', animal:'动物', num:'数字', life:'生活'};
const LIB = [
  {zi:'日',py:'rì',mean:'太阳',ci:'日子',w1:'日水',w2:'日山',cat:'nature',svg:`<circle cx="50" cy="50" r="36" fill="#FFD23F"/><circle cx="50" cy="50" r="11" fill="#FF7B00"/>`},
  {zi:'月',py:'yuè',mean:'月亮',ci:'月亮',w1:'月火',w2:'月门',cat:'nature',svg:`<path d="M58 12 A38 38 0 1 0 58 88 A30 30 0 1 1 58 12 Z" fill="#FFE08A" stroke="#E8B84B" stroke-width="2"/>`},
  {zi:'山',py:'shān',mean:'高山',ci:'大山',w1:'山火',w2:'山木',cat:'nature',svg:`<polygon points="12,82 32,40 52,82" fill="#7FB069"/><polygon points="40,82 62,28 84,82" fill="#4F7A5B"/><rect x="8" y="80" width="84" height="8" rx="3" fill="#6B4F2A"/>`},
  {zi:'水',py:'shuǐ',mean:'喝水的水',ci:'河水',w1:'水人',w2:'水石',cat:'nature',svg:`<path d="M12 32 q14 -14 28 0 t28 0" fill="none" stroke="#4D96FF" stroke-width="7" stroke-linecap="round"/><path d="M12 52 q14 -14 28 0 t28 0" fill="none" stroke="#4D96FF" stroke-width="7" stroke-linecap="round"/><path d="M12 72 q14 -14 28 0 t28 0" fill="none" stroke="#4D96FF" stroke-width="7" stroke-linecap="round"/>`},
  {zi:'火',py:'huǒ',mean:'火苗',ci:'火山',w1:'火口',w2:'火目',cat:'nature',svg:`<path d="M50 12 C66 34 70 52 56 70 C70 64 64 84 50 88 C36 84 30 64 44 70 C30 52 34 34 50 12 Z" fill="#FF6B35"/><path d="M50 40 C58 52 58 64 50 78 C42 64 42 52 50 40 Z" fill="#FFD23F"/>`},
  {zi:'木',py:'mù',mean:'树木',ci:'木头',w1:'木田',w2:'木雨',cat:'nature',svg:`<rect x="45" y="44" width="10" height="44" rx="3" fill="#8B5A2B"/><circle cx="50" cy="34" r="24" fill="#6AB04C"/>`},
  {zi:'人',py:'rén',mean:'小人儿',ci:'大人',w1:'人石',w2:'人鸟',cat:'body',svg:`<circle cx="50" cy="24" r="11" fill="#FFB085"/><path d="M50 36 L40 86 M50 36 L60 86 M50 50 L30 70 M50 50 L70 70" stroke="#FFB085" stroke-width="8" fill="none" stroke-linecap="round"/>`},
  {zi:'口',py:'kǒu',mean:'嘴巴',ci:'口水',w1:'口鱼',w2:'口心',cat:'body',svg:`<rect x="28" y="34" width="44" height="34" rx="10" fill="#FF9F1C" stroke="#E07B00" stroke-width="3"/><path d="M40 56 q10 8 20 0" stroke="#E07B00" stroke-width="3" fill="none" stroke-linecap="round"/>`},
  {zi:'目',py:'mù',mean:'眼睛',ci:'目光',w1:'目马',w2:'目禾',cat:'body',svg:`<ellipse cx="50" cy="50" rx="34" ry="20" fill="#FFFFFF" stroke="#3A3A3A" stroke-width="3"/><circle cx="50" cy="50" r="9" fill="#3A3A3A"/>`},
  {zi:'田',py:'tián',mean:'田地',ci:'田地',w1:'田门',w2:'田月',cat:'life',svg:`<rect x="26" y="28" width="48" height="48" rx="6" fill="#A8D08D" stroke="#5C8A3A" stroke-width="3"/><line x1="50" y1="28" x2="50" y2="76" stroke="#5C8A3A" stroke-width="3"/><line x1="26" y1="52" x2="74" y2="52" stroke="#5C8A3A" stroke-width="3"/>`},
  {zi:'石',py:'shí',mean:'石头',ci:'石头',w1:'石水',w2:'石火',cat:'nature',svg:`<path d="M22 62 Q16 36 46 34 Q78 32 74 60 Q78 84 48 84 Q22 84 22 62 Z" fill="#9E9E9E" stroke="#6E6E6E" stroke-width="3"/>`},
  {zi:'门',py:'mén',mean:'大门',ci:'门口',w1:'门山',w2:'门木',cat:'life',svg:`<rect x="28" y="22" width="16" height="62" rx="4" fill="#C98A3B" stroke="#8A5A1B" stroke-width="3"/><rect x="56" y="22" width="16" height="62" rx="4" fill="#C98A3B" stroke="#8A5A1B" stroke-width="3"/>`},

/* ===================== 发音朗读（SpeechSynthesis） ===================== */
let zhVoice=null;
function pickVoice(){ const vs=speechSynthesis.getVoices(); zhVoice=vs.find(v=>/^zh/i.test(v.lang))||vs.find(v=>/chinese/i.test(v.name))||null; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }
function speak(zi,py){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const say=(txt,rate,delay)=>{
      const u=new SpeechSynthesisUtterance(txt);
      u.lang='zh-CN'; u.rate=rate; u.pitch=1.15;
      const v=speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang)); if(v) u.voice=v;
      if(delay){ setTimeout(()=>speechSynthesis.speak(u),delay); } else { speechSynthesis.speak(u); }
    };
    say(zi,0.8,0);
    say(py,0.7,650);
  }catch(e){}
}

/* ===================== 撒花动效 ===================== */
function confetti(n){
  const c=document.getElementById('fx'); if(!c) return;
  const ctx=c.getContext('2d');
  const W=c.width=innerWidth, H=c.height=innerHeight;
  const colors=['#FF8C42','#FFD23F','#6AB04C','#4D96FF','#FF5D8F','#9B5DE5'];
  const ps=[];
  for(let i=0;i<(n||90);i++){
    ps.push({x:W/2+(Math.random()-.5)*220,y:H/3+Math.random()*50,vx:(Math.random()-.5)*10,vy:Math.random()*-10-3,r:4+Math.random()*7,c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.3});
  }
  let t=0; c.style.display='block';
  (function frame(){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.rot+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r,p.r*2,p.r*2); ctx.restore(); });
    if(++t<95) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); c.style.display='none'; }
  })();
}

/* ===================== 微交互：磁吸 ===================== */
function attachMagnetic(){
  if(!matchMedia('(hover:hover)').matches) return;
  document.querySelectorAll('.card,.reward').forEach(el=>{
    el.addEventListener('pointermove',e=>{
      const r=el.getBoundingClientRect();
      const x=e.clientX-r.left-r.width/2, y=e.clientY-r.top-r.height/2;
      el.style.transform=`translate(${x*0.06}px,${y*0.08}px)`;
    });
    el.addEventListener('pointerleave',()=>{ el.style.transform=''; });
  });
}

/* ===================== 状态 ===================== */
const PREFIX='wb_shizi_';
let S=null, mode='kid', kidView='home', prac={queue:[],idx:0,correct:0,locked:false};
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function load(){ const raw=localStorage.getItem(PREFIX+'state'); if(raw){ try{ S=JSON.parse(raw); }catch(e){ S=null; } } if(!S||!S.inited){ seed(); } rollDaily(); }
function save(){ localStorage.setItem(PREFIX+'state',JSON.stringify(S)); }
function rid(){ return 'i'+Math.random().toString(36).slice(2,9); }
function seed(){
  S={inited:1,stars:8,index:0,everLearned:{},daily:null,
    rewards:[{id:rid(),name:'贴纸一张',cost:10,color:'#FFD23F'},{id:rid(),name:'去公园玩',cost:30,color:'#6AB04C'},{id:rid(),name:'多看一集动画片',cost:20,color:'#4D96FF'}],
    pending:[],redeemed:[],parentpwd:null,settings:{daily:5}};
  const old=new Date(); old.setDate(old.getDate()-2);
  S.pending.push({id:rid(),rewardId:null,name:'贴纸一张',cost:10,time:old.toISOString()});
  genNewDaily(true); save();
}
function dailyChars(){ const n=S.settings.daily||5,arr=[]; for(let i=0;i<n;i++) arr.push(LIB[(S.index+i)%LIB.length].zi); return arr; }
function genNewDaily(){ S.daily={date:todayStr(),chars:dailyChars(),learned:{}}; }
function isComplete(d){ return d&&d.chars&&d.chars.every(z=>d.learned&&d.learned[z]); }
function rollDaily(){
  const t=todayStr();
  if(!S.daily){ genNewDaily(); }
  else if(S.daily.date!==t){
    if(isComplete(S.daily)){ S.index=(S.index+S.daily.chars.length)%LIB.length; genNewDaily(); }
    else { S.daily.date=t; }
  }
}

          <div class="ctr"><b>${S.stars}</b><small>颗星</small></div>
        </div>
        <div class="level-info"><div class="lv">第 ${lvl} 关</div><p>再得 ${10-inLvl} 颗星升下一关！<br>累计 ${S.stars} 颗星可以换礼物～</p></div>
      </div>
      <h3 class="sec-title mt" style="font-size:17px">${giftSvg('#FF8C42')} 奖励商城</h3>
      <div class="rewards">${rewards}</div>
    </div>`;
}
function animateRing(){
  const el=document.getElementById('ringP'); if(!el) return;
  requestAnimationFrame(()=>{ el.style.strokeDashoffset=el.dataset.off; });
}
function renderPractice(){
  const q=prac.queue;
  if(prac.idx>=q.length){
    confetti(110);
    return `<div class="section center">
        <div style="font-size:60px">${starSvg('#FFD23F')}</div>
        <h2 style="color:var(--primary-d)">练习完成！</h2>
        <p class="muted">本次答对 ${prac.correct}/${q.length} 个，获得 ${prac.correct} 颗星</p>
        <div class="mt"><button class="btn green" onclick="exitPractice()">${starSvg('#fff')} 回到首页</button></div>
      </div>`;
  }
  const z=q[prac.idx], c=LIB_MAP[z];
  let opts=[{t:c.ci,ok:true},{t:c.w1,ok:false},{t:c.w2,ok:false}]; opts.sort(()=>Math.random()-0.5);
  const optHtml=opts.map((o,i)=>`<div class="opt" id="opt${i}" onclick="answer(${i},${o.ok})">${o.t}</div>`).join('');
  return `<div class="section">
      <div class="handler-top"><h2 style="color:var(--primary-d)">${gameSvg()} 组词练习 ${prac.idx+1}/${q.length}</h2><span class="progress-pill">对 ${prac.correct}</span></div>
      <div class="practice-char">
        <button class="speak" onclick="speak('${z}','${c.py}')">${speakerSvg()}</button>
        <div class="big">${z}</div><svg viewBox="0 0 100 100">${c.svg}</svg>
        <p class="muted">“${z}” 可以组成哪个词？</p>
      </div>
      <div class="opts">${optHtml}</div>
      <div class="practice-foot"><button class="btn ghost sm" onclick="exitPractice()">退出</button><span class="muted">点错也没关系，再试一次～</span></div>
    </div>`;
}

/* ===================== 交互 ===================== */
function flip(i){
  const el=document.getElementById('card'+i); if(!el) return;
  el.classList.toggle('flip');
  if(el.classList.contains('flip')){ const z=S.daily.chars[i]; const c=LIB_MAP[z]; speak(z,c.py); }
}
function markLearned(z){
  const d=S.daily; if(d.learned[z]) return;
  d.learned[z]=true; let g=0; if(!S.everLearned[z]){ S.everLearned[z]=true; S.stars++; g=1; }
  save(); render(); toast('认识啦！+'+(g)+' 颗星'); if(g) confetti(40);
}
function finishToday(){
  const d=S.daily; let gained=0;
  d.chars.forEach(z=>{ if(!d.learned[z]){ d.learned[z]=true; if(!S.everLearned[z]){ S.everLearned[z]=true; S.stars++; gained++; } } });
  save(); render(); if(gained>0){ confetti(120); toast('今日完成！+'+gained+' 颗星'); } else { toast('今天已经学完啦！'); }
}
function startPractice(){ prac.queue=S.daily.chars.slice(); prac.idx=0; prac.correct=0; prac.locked=false; kidView='practice'; render(); }
function answer(i,ok){
  if(prac.locked) return;
  const el=document.getElementById('opt'+i);
  if(ok){ el.classList.add('correct'); prac.locked=true; prac.correct++; S.stars++; save();
    setTimeout(()=>{ prac.idx++; prac.locked=false; render(); },650);
  } else { el.classList.add('wrong'); setTimeout(()=>{ if(el) el.classList.remove('wrong'); },450); }
}
function exitPractice(){ kidView='home'; render(); }
function requestReward(id){
  const r=S.rewards.find(x=>x.id===id); if(!r||S.stars<r.cost) return;
  S.pending.push({id:rid(),rewardId:r.id,name:r.name,cost:r.cost,time:new Date().toISOString()});
  save(); render(); toast('已申请，等爸爸妈妈确认～');
}

/* ===================== 家长模式 ===================== */
function switchMode(m){ mode=m; kidView='home'; document.getElementById('tabKid').classList.toggle('active',m==='kid'); document.getElementById('tabPar').classList.toggle('active',m==='parent'); render(); }
function parentUnlocked(){ return !!S.parentpwd && sessionStorage.getItem(PREFIX+'ok')==='1'; }
function renderParent(){
  if(!S.parentpwd){
    return `<div class="gate">
      <svg class="lock" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#FF8C42" stroke-width="2.2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#FF8C42" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="15" r="1.8" fill="#FF8C42"/></svg>
      <h2 style="color:var(--primary-d)">设置 4 位家长密码</h2><p class="muted">用来锁住家长设置，小朋友打不开。</p>
      <input id="pw1" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
      <div class="err" id="pwErr"></div><button class="btn block" onclick="setPwd()">${giftSvg('#fff')} 确定设置</button></div>`;
  }
  if(!parentUnlocked()){
    return `<div class="gate">
      <svg class="lock" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#FF8C42" stroke-width="2.2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#FF8C42" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="15" r="1.8" fill="#FF8C42"/></svg>
      <h2 style="color:var(--primary-d)">家长模式已锁定</h2><p class="muted">请输入 4 位密码</p>
      <input id="pw2" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
      <div class="err" id="pwErr"></div><button class="btn block" onclick="checkPwd()">${giftSvg('#fff')} 解锁</button></div>`;
  }
  const overdue=S.pending.filter(p=>new Date(p.time) < new Date(Date.now()-86400000));
  let handler='';
  if(S.pending.length>0){
    const items=S.pending.map(p=>{
      const old=new Date(p.time) < new Date(Date.now()-86400000);
      return `<div class="item"><div class="info"><b>${p.name}</b><small>${old?'待确认较久 · ':'待确认 · '}${fmtTime(p.time)}</small></div>
        <div class="acts"><button class="btn green sm" onclick="confirmReward('${p.id}')">确认</button><button class="btn ghost sm" onclick="rejectReward('${p.id}')">驳回</button></div></div>`;
    }).join('');
    handler=`<div class="section handler${overdue.length?' overdue':''}"><h2>${giftSvg('#FF5D8F')} 今天要处理：${S.pending.length} 个兑换申请</h2><div class="mt">${items}</div></div>`;
  }
  const taskSec=`<div class="psec"><h3>${bookSvg()} 发布认字任务</h3>
      <div class="inline-form"><span class="muted">每天学</span><input id="dailyN" type="number" inputmode="numeric" min="1" max="38" value="${S.settings.daily}"><span class="muted">个字</span><button class="btn sm" onclick="setDaily()">保存</button></div>
      <div class="row2"><button class="btn blue" onclick="rearrange()">${bookSvg()} 重排新字（从头学）</button><button class="btn ghost" onclick="resetProgress()">${starSvg('#E76F24')} 重置今日进度</button></div>
      <p class="muted mt">当前进度：已学到第 ${Math.min(S.index+1,LIB.length)}/${LIB.length} 个字 · 累计认过 ${Object.keys(S.everLearned).length} 个字</p></div>`;
  const rewardList=S.rewards.map(r=>`<div class="item"><div class="ico" style="width:34px">${giftSvg(r.color)}</div><div class="info"><b>${r.name}</b><small>需 ${r.cost} 颗星</small></div><div class="acts"><button class="btn ghost sm" onclick="delReward('${r.id}')">删除</button></div></div>`).join('')||'<p class="muted">还没有奖励</p>';
  const rewardSec=`<div class="psec"><h3>${giftSvg('#FF5D8F')} 奖励管理</h3>
      <div class="inline-form"><input id="rName" placeholder="奖励名称，如：去公园玩" maxlength="20"><input id="rCost" type="number" inputmode="numeric" min="1" placeholder="星数"><button class="btn pink sm" onclick="addReward()">添加</button></div>
      <div class="mt">${rewardList}</div></div>`;
  const redList=S.redeemed.slice().reverse().map(r=>`<div class="item"><div class="ico" style="width:30px">${giftSvg('#6AB04C')}</div><div class="info"><b>${r.name}</b><small>${r.cost} 颗星 · ${fmtTime(r.time)}</small></div></div>`).join('')||'<p class="muted">还没有兑换记录</p>';
  const groups={}; LIB.forEach(c=>{(groups[c.cat]=groups[c.cat]||[]).push(c);});
  const libPrev=Object.keys(groups).map(g=>{
    const items=groups[g].map(c=>`<div class="libitem" onclick="speak('${c.zi}','${c.py}')"><div class="lz">${c.zi}</div><svg viewBox="0 0 100 100">${c.svg}</svg></div>`).join('');
    return `<div class="libgroup"><h4>${CAT[g]}（${groups[g].length}）</h4><div class="librow">${items}</div></div>`;
  }).join('');
  const danger=`<div class="psec"><h3 style="color:#D12B2B">${giftSvg('#D12B2B')} 数据管理</h3>
      <div class="row2"><button class="btn ghost" onclick="clearSample()">清空示例数据</button><button class="btn ghost" style="color:#D12B2B;border-color:#FFB3B3" onclick="clearAll()">清空全部数据</button></div>
      <p class="muted mt">清空示例：移除演示奖励/兑换申请，保留字库。清空全部：重置整个工作台。</p></div>`;
  return handler+taskSec+rewardSec+`
    <div class="psec"><h3>${giftSvg('#6AB04C')} 已兑换记录</h3>${redList}</div>
    <div class="psec"><h3>${bookSvg()} 字库预览（${LIB.length} 个字 · 点一下能听）</h3>${libPrev}</div>`+danger;
}
function fmtTime(iso){ const d=new Date(iso); return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function setPwd(){ const v=document.getElementById('pw1').value; if(!/^\d{4}$/.test(v)){ document.getElementById('pwErr').textContent='请输入 4 位数字'; return; } S.parentpwd=v; save(); sessionStorage.setItem(PREFIX+'ok','1'); render(); toast('密码已设置'); }
function checkPwd(){ const v=document.getElementById('pw2').value; if(v===S.parentpwd){ sessionStorage.setItem(PREFIX+'ok','1'); render(); } else document.getElementById('pwErr').textContent='密码不对，再试试'; }
function setDaily(){ let n=parseInt(document.getElementById('dailyN').value)||5; n=Math.max(1,Math.min(38,n)); S.settings.daily=n; save(); render(); toast('已设为每天 '+n+' 个字'); }
function rearrange(){ if(!confirm('重新从头学？当前进度会回到第一个字。')) return; S.index=0; genNewDaily(); save(); render(); toast('已重排，从第一个字开始'); }
function resetProgress(){ if(!confirm('把今天的认字进度清空，重新开始今天？')) return; genNewDaily(); save(); render(); toast('今日进度已重置'); }
function addReward(){ const nm=document.getElementById('rName').value.trim(); let c=parseInt(document.getElementById('rCost').value)||0; if(!nm){ toast('请填写奖励名称'); return; } if(c<1){ toast('请填写正确星数'); return; } S.rewards.push({id:rid(),name:nm,cost:c,color:pickColor()}); save(); render(); toast('奖励已添加'); }
function pickColor(){ const a=['#FFD23F','#6AB04C','#4D96FF','#FF5D8F','#FF8C42','#9B5DE5']; return a[Math.floor(Math.random()*a.length)]; }
function delReward(id){ S.rewards=S.rewards.filter(r=>r.id!==id); save(); render(); }
function confirmReward(id){ const p=S.pending.find(x=>x.id===id); if(!p) return; if(S.stars<p.cost){ toast('星星不够，无法兑换'); return; } S.stars-=p.cost; S.redeemed.push({id:rid(),name:p.name,cost:p.cost,time:new Date().toISOString()}); S.pending=S.pending.filter(x=>x.id!==id); save(); render(); confetti(100); toast('兑换成功！奖励：'+p.name); }
function rejectReward(id){ S.pending=S.pending.filter(x=>x.id!==id); save(); render(); toast('已驳回'); }
function clearSample(){ if(!confirm('清空示例数据？会移除演示的奖励和兑换申请，字库和设置保留。')) return; S.pending=[]; S.redeemed=[]; S.stars=0; S.index=0; S.everLearned={}; genNewDaily(); save(); if(mode==='kid') kidView='home'; render(); toast('示例数据已清空'); }
function clearAll(){ if(!confirm('确定清空全部数据？工作台会恢复到初始样子，此操作不可恢复！')) return; Object.keys(localStorage).forEach(k=>{ if(k.startsWith(PREFIX)) localStorage.removeItem(k); }); sessionStorage.removeItem(PREFIX+'ok'); S=null; load(); mode='kid'; kidView='home'; document.getElementById('tabKid').classList.add('active'); document.getElementById('tabPar').classList.remove('active'); render(); toast('已全部清空'); }

/* ===================== 备份 ===================== */
function exportJSON(){ const data={}; Object.keys(localStorage).forEach(k=>{ if(k.startsWith(PREFIX)) data[k]=localStorage.getItem(k); }); const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='宝宝识字台备份_'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); toast('已导出备份'); }
function importJSON(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const obj=JSON.parse(r.result); let n=0; Object.keys(obj).forEach(k=>{ if(k.startsWith(PREFIX)){ localStorage.setItem(k,obj[k]); n++; } }); S=null; load(); mode='kid'; kidView='home'; document.getElementById('tabKid').classList.add('active'); document.getElementById('tabPar').classList.remove('active'); render(); toast('已导入 '+n+' 条数据'); }catch(err){ alert('文件格式不对，导入失败'); } e.target.value=''; }; r.readAsText(f); }

/* ===================== 工具 ===================== */
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }

/* ===================== 离线（Service Worker） ===================== */
if(location.protocol.indexOf('http')===0 && 'serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

/* ===================== 启动 ===================== */
load(); render();
</script>
</body>
</html>
